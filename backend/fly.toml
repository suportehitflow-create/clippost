app = "clippost-backend"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "immediate"
  max_unavailable = 1

[env]
  PORT = "8000"
  STORAGE_BUCKET = "videos"
  TEMP_DIR = "/tmp/clippost"

[processes]
  app = "uvicorn main:app --host 0.0.0.0 --port 8000"
  worker = "sh -c 'celery -A celery_app worker --loglevel=info --concurrency=2 || sleep 86400'"
  beat = "sh -c 'celery -A celery_app beat --loglevel=info || sleep 86400'"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
  processes = ["worker"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["beat"]
