name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy Frontend (Vercel)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm i -g vercel@latest
          echo "=== Vercel version ==="
          vercel --version
          echo "=== Listing projects ==="
          vercel project ls --token "$VERCEL_TOKEN" 2>&1 || echo "project ls failed"
          echo "=== Deploying ==="
          vercel --token "$VERCEL_TOKEN" --prod --yes --debug 2>&1 | tail -50

  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Backend (Fly.io)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          curl -L https://fly.io/install.sh | sh
          export PATH="$HOME/.fly/bin:$PATH"
          cd backend
          flyctl deploy --remote-only

      - name: Verify health
        run: |
          sleep 30
          FLY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://clippost-backend.fly.dev/health)
          echo "Fly.io health: $FLY_STATUS"
          [ "$FLY_STATUS" = "200" ] && echo "Backend OK" || echo "Backend not responding yet"
