name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4 
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy Frontend (Vercel)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm i -g vercel@latest
          WHOAMI=$(vercel whoami --token "$VERCEL_TOKEN" 2>&1 || echo "whoami failed")
          ALL_PROJECTS=$(vercel ls --token "$VERCEL_TOKEN" 2>&1 | head -40 || echo "ls failed")
          rm -f .vercel/project.json
          vercel link --yes --project clippost-silk --token "$VERCEL_TOKEN" 2>&1 || true
          PROJECT_JSON=$(cat .vercel/project.json 2>/dev/null || echo "no project.json")
          DEPLOY_OUT=$(vercel --token "$VERCEL_TOKEN" --prod --yes 2>&1 || echo "deploy failed")
          echo "## Vercel Debug" >> $GITHUB_STEP_SUMMARY
          echo "**whoami:** $WHOAMI" >> $GITHUB_STEP_SUMMARY
          echo "**projects:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$ALL_PROJECTS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "**project.json:** $PROJECT_JSON" >> $GITHUB_STEP_SUMMARY
          echo "**deploy output:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$DEPLOY_OUT" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Backend (Fly.io)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          curl -L https://fly.io/install.sh | sh
          export PATH="$HOME/.fly/bin:$PATH"
          cd backend
          flyctl deploy --remote-only

      - name: Verify health
        run: |
          sleep 30
          FLY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://clippost-backend.fly.dev/health)
          echo "Fly.io health: $FLY_STATUS"
          [ "$FLY_STATUS" = "200" ] && echo "Backend OK" || echo "Backend not responding yet"
