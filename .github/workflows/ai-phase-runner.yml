name: AI Phase Runner

on:
  workflow_dispatch:
    inputs:
      phase_file:
        description: "Phase file path (e.g. docs/fases/fase_03_emergencia_comunicacao.md)"
        required: true
        default: "docs/fases/fase_03_emergencia_comunicacao.md"
      max_iterations:
        description: "Max autocorrection attempts"
        required: false
        default: "8"

jobs:
  run-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Run AI Phase Runner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PHASE_FILE: ${{ github.event.inputs.phase_file }}
          MAX_ITERATIONS: ${{ github.event.inputs.max_iterations }}
        run: python3 .github/scripts/phase_runner.py

      - name: Commit implemented phase
        run: |
          PHASE_NAME=$(basename "${{ github.event.inputs.phase_file }}" .md)
          git config user.name "AI Phase Runner"
          git config user.email "bot@clippost.ai"
          git checkout -b "ai-phase/${PHASE_NAME}" 2>/dev/null || git checkout "ai-phase/${PHASE_NAME}"
          git add -A
          git commit -m "ai: implement ${PHASE_NAME}" || echo "Nothing to commit"
          git push origin "ai-phase/${PHASE_NAME}" --force

      - name: Deploy Frontend (Vercel)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel
          vercel --token "$VERCEL_TOKEN" --prod --yes

      - name: Deploy Backend (Fly.io)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          curl -L https://fly.io/install.sh | sh
          export FLYCTL_INSTALL="/root/.fly"
          export PATH="$FLYCTL_INSTALL/bin:$PATH"
          cd backend
          flyctl deploy --remote-only

      - name: Verify health endpoints
        run: |
          sleep 15
          VERCEL_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://clippost-silk.vercel.app)
          FLY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://clippost-backend.fly.dev/health)
          echo "Vercel: $VERCEL_STATUS | Fly.io: $FLY_STATUS"
