name: AI Phase Runner

on:
  workflow_dispatch:
    inputs:
      phase_file:
        description: "Arquivo da fase (ex: fase_06_monetizacao.md)"
        required: true
        default: "fase_06_monetizacao.md"

permissions:
  contents: write

jobs:
  run-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPLABS_API_KEY: ${{ secrets.EXPLABS_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      MAX_ATTEMPTS: "5"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AI runner deps
        run: pip install openai

      - name: Run AI Phase Loop
        id: ai_loop
        run: python scripts/ai_phase_runner.py
        env:
          INPUT_PHASE_FILE: ${{ github.event.inputs.phase_file }}

      - name: Deploy Frontend if Green
        if: success()
        run: |
          npm i -g vercel@latest
          vercel --token "$VERCEL_TOKEN" --prod --yes 2>&1

      - name: Deploy Backend if Green
        if: success()
        run: |
          curl -L https://fly.io/install.sh | sh
          export PATH="$HOME/.fly/bin:$PATH"
          cd backend
          flyctl deploy --remote-only
