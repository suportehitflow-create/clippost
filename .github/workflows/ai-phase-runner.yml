name: AI Phase Runner

on:
  workflow_dispatch:
    inputs:
      phase_file:
        description: "Arquivo da fase (ex: fase_06_monetizacao.md) ou 'all' para varredura completa"
        required: true
        default: "all"

permissions:
  contents: write

jobs:
  run-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EXPLABS_API_KEY: ${{ secrets.EXPLABS_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      MAX_ATTEMPTS: "5"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AI runner deps
        run: pip install openai

      - name: Run AI Phase Loop
        id: ai_loop
        run: python -u scripts/ai_phase_runner.py
        env:
          INPUT_PHASE_FILE: ${{ github.event.inputs.phase_file }}

      # Sem este passo o codigo gerado existia so no runner: o Vercel deployava
      # a partir dele e o repositorio continuava sem as mudancas, entao o proximo
      # push de master revertia tudo em producao.
      - name: Commit do codigo gerado
        if: steps.ai_loop.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao gerada pela IA."
          else
            git commit -m "chore(ai): ${{ github.event.inputs.phase_file }} aplicada pelo phase runner"
            git pull --rebase origin master
            git push origin HEAD:master
          fi

      - name: Deploy Frontend
        if: always()
        run: |
          npm i -g vercel@latest
          rm -rf .vercel
          vercel --token "$VERCEL_TOKEN" --prod --yes 2>&1

      - name: Deploy Backend
        if: always()
        run: |
          if ! python -m compileall -q backend; then
            echo "::error::Backend com erro de sintaxe Python — deploy abortado para nao quebrar producao."
            exit 1
          fi
          curl -L https://fly.io/install.sh | sh
          export PATH="$HOME/.fly/bin:$PATH"
          cd backend
          flyctl deploy --remote-only
