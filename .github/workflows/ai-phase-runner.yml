name: AI Phase Runner

on:
  workflow_dispatch:
    inputs:
      phase_file:
        description: "Phase file path (e.g. docs/fases/fase_03b_resgate_completo.md)"
        required: true
        default: "docs/fases/fase_03b_resgate_completo.md"
      max_iterations:
        description: "Max autocorrection attempts"
        required: false
        default: "6"

permissions:
  contents: write

jobs:
  run-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run AI Phase Runner
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PHASE_FILE: ${{ github.event.inputs.phase_file }}
          MAX_ITERATIONS: ${{ github.event.inputs.max_iterations }}
          FRONTEND_DIR: "."
          BACKEND_DIR: "backend"
        run: python3 .github/scripts/phase_runner.py

      - name: Commit implemented phase
        run: |
          PHASE_NAME=$(basename "${{ github.event.inputs.phase_file }}" .md)
          git config user.name "AI Phase Runner"
          git config user.email "bot@clippost.ai"
          BRANCH="ai-phase/${PHASE_NAME}"
          git checkout -b "$BRANCH" 2>/dev/null || git checkout "$BRANCH"
          git add -A
          git diff --cached --quiet || git commit -m "ai: implement ${PHASE_NAME}"
          git push origin "$BRANCH" --force

      - name: Deploy Frontend (Vercel)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel
          vercel --token "$VERCEL_TOKEN" --prod --yes

      - name: Deploy Backend (Fly.io)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          curl -L https://fly.io/install.sh | sh
          export FLYCTL_INSTALL="/root/.fly"
          export PATH="$FLYCTL_INSTALL/bin:$PATH"
          cd backend
          flyctl deploy --remote-only

      - name: Verify health endpoints
        run: |
          sleep 20
          VERCEL_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://clippost-silk.vercel.app)
          FLY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://clippost-backend.fly.dev/health)
          echo "Vercel: $VERCEL_STATUS | Fly.io: $FLY_STATUS"
          if [ "$VERCEL_STATUS" = "200" ] && [ "$FLY_STATUS" = "200" ]; then
            echo "BOTH_OK=true" >> $GITHUB_ENV
          fi

      - name: Notify success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          PHASE_NAME=$(basename "${{ github.event.inputs.phase_file }}" .md)
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\":white_check_mark: *ClipPost — ${PHASE_NAME} deployada!*\nVercel + Fly.io respondendo 200.\nhttps://clippost-silk.vercel.app\"}"
          fi

      - name: Notify failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\":x: *AI Phase Runner falhou.*\nLogs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi
