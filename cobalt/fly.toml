app = "clippost-cobalt"
primary_region = "gru"

[build]
  image = "ghcr.io/imputnet/cobalt:11"

[env]
  API_URL = "https://clippost-cobalt.fly.dev"
  PORT = "9000"

[http_service]
  internal_port = 9000
  force_https = true
  # Dorme quando não usada — tier gratuito
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
