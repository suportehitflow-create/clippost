# Servidor do Editor em Massa. Deploy: fly deploy --ha=false -c fly.editor.toml (sempre 1 máquina:
# os arquivos enviados e a fila ficam no disco/memória dela)
app = "clippost-editor"
primary_region = "gru"
# Espera os vídeos em processamento terminarem antes de reiniciar num deploy (máx. do Fly)
kill_timeout = 30

[build]
  dockerfile = "Dockerfile.editor"

[env]
  SUPABASE_URL = "https://leyzjilgrlmboexjmdbg.supabase.co"
  # Chave publicável (a mesma que vai no navegador) — só valida o login do usuário
  SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxleXpqaWxncmxtYm9leGptZGJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMTQ4ODgsImV4cCI6MjEwNjc5MDg4OH0.xwiLSjslej-7T5y-gecns6Qe6QXu3IVZImnNR2cFVW0"
  EDITOR_MASSA_CONCURRENCIA = "2"
  EDITOR_MASSA_PRESET = "veryfast"
  EDITOR_MASSA_RETENCAO_HORAS = "24"

[http_service]
  internal_port = 8080
  force_https = true
  # A fila e os vídeos prontos ficam na memória/disco da máquina: não pode desligar sozinha
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/api/editor-massa/saude"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
